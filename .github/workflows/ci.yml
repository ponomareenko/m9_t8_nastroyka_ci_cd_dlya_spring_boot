name: Push exercise

on:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
#      - name: Simulate failure
#        run: exit 1
      - name: Build and test
        run: ./mvnw -B clean verify
      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: todo-application
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -t "ghcr.io/ponomareenko/todo-api:${GITHUB_SHA}" .
      - name: Push Docker image
        run: docker push "ghcr.io/ponomareenko/todo-api:${GITHUB_SHA}"
      - name: Check SSH connection
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: IMAGE_TAG
          script: |
            set -e
            whoami
            docker ps
            docker pull "ghcr.io/ponomareenko/todo-api:${IMAGE_TAG}"
      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          curl --fail --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=TODO API: результат CI — ${BUILD_STATUS}"